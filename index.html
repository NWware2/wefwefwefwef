<!DOCTYPE html>

<head>

<style>
  :root {

  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(2,7,13,0.55) 100%); }

  /* ---------- Mandatory promotional banner (never hidden) ---------- */
  #promo-banner {

    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

/* =====================================================================
   1. Renderer, scene, shared state
   World conventions: +Y up, +Z toward the viewer (front of the tank).
   Tank interior: x -3.5..3.5, y -2.2..2.25, z -1.75..1.75, waterline y = 2.03.
   Countertop y = -2.55, floor y = -5.3, back wall z = -2.9.
   ===================================================================== */
const TANK = { w: 7, h: 4.45, d: 3.5, x0: -3.5, x1: 3.5, y0: -2.2, y1: 2.25, z0: -1.75, z1: 1.75, water: 2.03, glass: 0.06, sand: -1.72 };
const ROOM = { counterY: -2.55, floorY: -5.3, wallZ: -2.9, counterX0: -6.4, counterX1: 7.0, counterZ0: -2.75, counterZ1: 2.9 };

const canvas = document.getElementById("scene");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
} catch (e) {
  const fb = document.getElementById("fallback");
  fb.style.display = "flex"; fb.textContent = "WebGL is not available in this browser. The promotional link above still works.";
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environment = envTex;
pmrem.dispose();

const U = { time: { value: 0 }, night: { value: 0 } };          // shared shader uniforms (simulation time, night mix)
const disposables = [];                                           // generated textures / render targets
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reducedMotion) document.body.classList.add("reduced-motion");

const sim = { time: 0, paused: false, dt: 0 };                    // living-world clock (freezes on pause)
const ui = { time: 0, dt: 0 };                                    // interface clock (never freezes)

/* ---------- small math / random helpers ---------- */
let seed = 1337;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const damp = (cur, target, rate, dt) => lerp(cur, target, 1 - Math.exp(-rate * dt));
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const _v1 = V3(), _v2 = V3(), _v3 = V3(), _q1 = new THREE.Quaternion(), _m1 = new THREE.Matrix4();

/* ---------- geometry helpers ---------- */
function mesh(geo, mat, x = 0, y = 0, z = 0, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (o.rot) m.rotation.set(o.rot[0], o.rot[1], o.rot[2]);
  if (o.scale) (typeof o.scale === "number") ? m.scale.setScalar(o.scale) : m.scale.set(...o.scale);
  if (o.cast) m.castShadow = true;
  if (o.receive) m.receiveShadow = true;
  if (o.parent) o.parent.add(m);
  if (o.name) m.name = o.name;
  return m;
}
const box = (w, h, d, mat, x, y, z, o) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, o);
const cyl = (rt, rb, h, seg, mat, x, y, z, o) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat, x, y, z, o);
const sph = (r, mat, x, y, z, o) => mesh(new THREE.SphereGeometry(r, 18, 14), mat, x, y, z, o);

/* Displace shared vertices by noise, keeping faces welded */
function roughen(geo, amount, freq = 3) {
  const g = mergeVertices(geo);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = Math.sin(x * freq + 1.3) * Math.cos(y * freq * 1.3 + 0.7) * Math.sin(z * freq * 0.8 + 2.1) + (rnd() - 0.5) * 0.6;
    const s = 1 + n * amount;
    p.setXYZ(i, x * s, y * s, z * s);
  }
  g.computeVertexNormals();
  return g;
}
/* Add per-vertex sway attributes: phase (per piece) and weight 0..1 along the piece's height */
function addSwayAttrs(geo, phase, swayFn) {
  const p = geo.attributes.position, n = p.count;
  const ph = new Float32Array(n), sw = new Float32Array(n);
  for (let i = 0; i < n; i++) { ph[i] = phase; sw[i] = swayFn(p.getX(i), p.getY(i), p.getZ(i), i); }
  geo.setAttribute("aPhase", new THREE.BufferAttribute(ph, 1));
  geo.setAttribute("aSway", new THREE.BufferAttribute(sw, 1));
  return geo;
}
function setVertexColor(geo, fn) {
  const p = geo.attributes.position, c = new Float32Array(p.count * 3), col = new THREE.Color();
  for (let i = 0; i < p.count; i++) { fn(col, p.getX(i), p.getY(i), p.getZ(i), i); c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b; }
  geo.setAttribute("color", new THREE.BufferAttribute(c, 3));
  return geo;
}
function transformed(geo, x, y, z, rot, scale) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rot?.[0] || 0, rot?.[1] || 0, rot?.[2] || 0));
  const s = typeof scale === "number" ? V3(scale, scale, scale) : (scale ? V3(...scale) : V3(1, 1, 1));
  m.compose(V3(x, y, z), q, s);
  return geo.applyMatrix4(m);
}
function stripExtraAttrs(geo) { for (const k of ["uv2", "uv1", "tangent"]) if (geo.attributes[k]) geo.deleteAttribute(k); return geo; }
function merge(list) { return mergeGeometries(list.map(stripExtraAttrs), false); }

/* ---------- Sway shader injection (plants, tentacles, soft coral) ---------- */
function addSway(mat, { amp = 0.08, speed = 1.0, key = "p", glow = 0 }) {
  const uGlow = { value: glow };
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = U.time; sh.uniforms.uAmp = { value: amp }; sh.uniforms.uSpeed = { value: speed }; sh.uniforms.uGlow = uGlow;
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nattribute float aPhase; attribute float aSway; uniform float uTime; uniform float uAmp; uniform float uSpeed; varying float vSway;")
      .replace("#include <begin_vertex>", `#include <begin_vertex>
        vSway = aSway;
        float sw = aSway * aSway * uAmp;
        float s1 = sin(uTime * uSpeed + aPhase);
        transformed.x += s1 * sw;
        transformed.z += cos(uTime * uSpeed * 0.77 + aPhase * 1.31) * sw * 0.7;
        transformed.y -= abs(s1) * sw * 0.18;`);
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying float vSway; uniform float uGlow;")
      .replace("#include <emissivemap_fragment>", `#include <emissivemap_fragment>
        #ifdef USE_COLOR
        totalEmissiveRadiance += vColor * uGlow * pow(vSway, 3.0);
        #endif`);
  };
  mat.customProgramCacheKey = () => "sway" + key;
  mat.userData.glow = uGlow;
  return mat;
}

/* =====================================================================
   2. Procedural textures and labels (all drawn on in-memory canvases)
   ===================================================================== */
function canvasTex(w, h, draw, opts = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d"); draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(opts.repeat[0], opts.repeat[1]); }
  disposables.push(t);
  return t;
}
function grain(ctx, w, h, n, alpha, col = "0,0,0") {
  for (let i = 0; i < n; i++) { ctx.fillStyle = `rgba(${col},${(rnd() * alpha).toFixed(3)})`; ctx.fillRect(rnd() * w, rnd() * h, rnd() * 3 + 1, rnd() * 3 + 1); }
}
const TEX = {};
TEX.wood = canvasTex(1024, 512, (c, w, h) => {
  c.fillStyle = "#6a4a2f"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const y = rnd() * h, amp = rnd() * 7 + 2;
    c.strokeStyle = `rgba(${40 + rnd() * 30},${22 + rnd() * 18},${10 + rnd() * 10},${0.25 + rnd() * 0.4})`; c.lineWidth = rnd() * 2.5 + 0.5;
    c.beginPath(); for (let x = 0; x <= w; x += 8) c.lineTo(x, y + Math.sin(x * 0.01 + i) * amp + Math.sin(x * 0.037 + i * 2) * 2); c.stroke();
  }
  for (let i = 0; i < 12; i++) { // directional scratches
    const x = rnd() * w, y = rnd() * h, l = rnd() * 120 + 40; c.strokeStyle = "rgba(220,200,170,0.35)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + l, y + (rnd() - 0.5) * 12); c.stroke();
  }
  grain(c, w, h, 2500, 0.18);
}, { repeat: [2, 1] });
TEX.teal = canvasTex(512, 512, (c, w, h) => {
  c.fillStyle = "#2f6e6d"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) { c.fillStyle = `rgba(255,255,255,${rnd() * 0.05})`; c.fillRect(rnd() * w, rnd() * h, rnd() * 80, rnd() * 80); }
  const worn = (x, y, r) => { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, "rgba(150,120,80,0.55)"); g.addColorStop(1, "rgba(150,120,80,0)"); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); };
  worn(0, 0, 70); worn(w, 0, 60); worn(0, h, 55); worn(w, h, 80); worn(w * 0.5, h * 0.55, 45);
  grain(c, w, h, 1800, 0.12);
});
TEX.floor = canvasTex(1024, 1024, (c, w, h) => {
  const pw = w / 6;
  for (let i = 0; i < 6; i++) {
    const shade = 46 + rnd() * 22;
    c.fillStyle = `rgb(${shade + 14},${shade - 2},${shade - 18})`; c.fillRect(i * pw, 0, pw, h);
    c.fillStyle = "rgba(0,0,0,0.5)"; c.fillRect(i * pw, 0, 3, h);
    const seamY = rnd() * h; c.fillRect(i * pw, seamY, pw, 3);
    for (let k = 0; k < 25; k++) { c.strokeStyle = `rgba(0,0,0,${rnd() * 0.18})`; c.lineWidth = rnd() * 1.5; c.beginPath(); const y = rnd() * h; c.moveTo(i * pw + 4, y); c.lineTo((i + 1) * pw - 4, y + (rnd() - 0.5) * 10); c.stroke(); }
  }
  grain(c, w, h, 4000, 0.2);
}, { repeat: [8, 3.5] });
TEX.wall = canvasTex(512, 512, (c, w, h) => {
  c.fillStyle = "#1d2b36"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 9; i++) { const g = c.createRadialGradient(rnd() * w, rnd() * h, 0, w / 2, h / 2, 130 + rnd() * 120); g.addColorStop(0, "rgba(90,80,60,0.12)"); g.addColorStop(1, "rgba(0,0,0,0)"); c.fillStyle = g; c.fillRect(0, 0, w, h); }
  grain(c, w, h, 3000, 0.1, "255,255,255");
}, { repeat: [8, 3] });
TEX.pebbleBand = canvasTex(512, 64, (c, w, h) => {
  c.fillStyle = "#4b3b2e"; c.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) { const col = ["#a68b68", "#77736c", "#8c7a63", "#5f574f", "#b59b78"][Math.floor(rnd() * 5)]; c.fillStyle = col; c.beginPath(); c.ellipse(rnd() * w, rnd() * h, rnd() * 5 + 2, rnd() * 3 + 2, rnd() * 3, 0, 7); c.fill(); }
}, { repeat: [6, 1] });
TEX.sand = canvasTex(512, 512, (c, w, h) => { c.fillStyle = "#c9ad7c"; c.fillRect(0, 0, w, h); grain(c, w, h, 6000, 0.22); grain(c, w, h, 2500, 0.25, "255,245,220"); }, { repeat: [4, 2] });

function labelTexture(w, h, lines, { bg = "#f1e7d0", ink = "#2a2118", font = "bold", pad = 0.12, rotate = 0, border = true, grainAmt = 0.08, decorate } = {}) {
  return canvasTex(w, h, (c) => {

function addRipple(x, z, amp = 1) { const r = ripples.reduce((a, b) => (a.t > b.t ? a : b)); r.x = x; r.z = z; r.t = 0; r.amp = amp; }
function updateSurface(dt) {
  const p = surfaceGeo.attributes.position, b = SURF.base, t = sim.time;
  for (const r of ripples) r.t += dt;
  for (let i = 0; i < p.count; i++) {
    const x = b[i * 3], z = b[i * 3 + 2];
    let y = Math.sin(x * 1.9 + t * 1.3) * 0.012 + Math.sin(z * 2.7 + t * 1.7) * 0.01 + Math.sin((x + z) * 1.2 - t * 0.9) * 0.008;

  const relief = g(-2.6, -1.2, 0.42, 0.9) + g(2.5, -1.1, 0.3, 1.1) + g(1.1, -0.2, 0.12, 1.6) + g(-2.8, 0.3, 0.1, 2.5) + g(-1.9, 0.75, 0.06, 3.0) - g(0.1, 0.35, 0.13, 0.5)

function ribbonGrass(x, z, count, hMin, hMax, spread) {
  const parts = [];
  for (let i = 0; i < count; i++) {
    const h = rr(hMin, hMax), g = new THREE.PlaneGeometry(rr(0.05, 0.09), h, 1, 8); g.translate(0, h / 2, 0);
    const p = g.attributes.position, bend = rr(-0.25, 0.25), twist = rr(-1, 1);
    for (let k = 0; k < p.count; k++) { const v = p.getY(k) / h; p.setX(k, p.getX(k) * Math.cos(v * twist) + v * v * bend); p.setZ(k, p.getX(k) * Math.sin(v * twist) * 0.3 + v * v * bend * 0.4); }
    setVertexColor(g, (c, px, py) => c.set(0x1d4a1a).lerp(new THREE.Color(0x7fd15a), Math.pow(py / h, 1.4)));
    addSwayAttrs(g, rnd() * 6.3, (px, py) => Math.pow(py / h, 1.3));

    parts.push(transformed(g, ox, sandH(ox, oz) - 0.03, oz, [0, rnd() * 6.3, 0]));

}

  };

function makePointCloud(n, bounds, size, color, plankton) {
  const pos = new Float32Array(n * 3), seed = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos[i * 3] = rr(bounds[0], bounds[1]); pos[i * 3 + 1] = rr(bounds[2], bounds[3]); pos[i * 3 + 2] = rr(bounds[4], bounds[5]); seed[i] = rnd(); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
  const mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.time, uNight: U.night, uSize: { value: size }, uColor: { value: new THREE.Color(color) }, uPlankton: { value: plankton ? 1 : 0 } },
    vertexShader: `attribute float aSeed; uniform float uTime; uniform float uSize; uniform float uNight; uniform float uPlankton; varying float vA;
      void main(){ vec3 p = position; float t = uTime;
        p.x += sin(t*0.21 + aSeed*31.0)*0.12 + sin(t*0.05 + aSeed*7.0)*0.2; p.y += sin(t*0.17 + aSeed*17.0)*0.1 + mod(t*0.02*(0.5+aSeed), 0.6) - 0.3; p.z += cos(t*0.19 + aSeed*23.0)*0.1;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float pulse = uPlankton > 0.5 ? pow(max(0.0, sin(t*0.9 + aSeed*40.0)), 10.0) : 0.0;
        vA = (0.18 + 0.12*aSeed) * (1.0 + uNight*0.6) + pulse * (0.7 + uNight*0.8);
        gl_PointSize = uSize * (1.0 + pulse*1.6) * (160.0 / -mv.z);
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uColor; varying float vA; void main(){ float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard; float a = smoothstep(0.5, 0.1, d) * vA; gl_FragColor = vec4(uColor * a, a); }`
  });
  const pts = new THREE.Points(g, mat); pts.renderOrder = 5; pts.frustumCulled = false; tankInner.add(pts); return pts;
}
makePointCloud(260, [-3.2, 3.2, -1.5, 1.85, -1.5, 1.5], 2.6, 0xcfe9ff, false);

const STEAM = { n: 34, items: [], anchor: V3(-4.5, -2.1, 1.8), geo: null, pts: null, acc: 0 };
(function buildSteam() {
  const g = STEAM.geo = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(STEAM.n * 3), 3));
  g.setAttribute("aAlpha", new THREE.BufferAttribute(new Float32Array(STEAM.n), 1));
  g.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(STEAM.n), 1));
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false,
    uniforms: {},
    vertexShader: `attribute float aAlpha; attribute float aSize; varying float vA; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vA = aAlpha; gl_PointSize = aSize * (220.0 / -mv.z); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord-0.5); if (d>0.5) discard; float a = smoothstep(0.5,0.0,d)*vA; gl_FragColor = vec4(vec3(0.9,0.93,0.95)*a, a); }` });
  STEAM.pts = new THREE.Points(g, mat); STEAM.pts.frustumCulled = false; STEAM.pts.renderOrder = 8; scene.add(STEAM.pts);
  for (let i = 0; i < STEAM.n; i++) STEAM.items.push({ life: -1, x: 0, y: 0, z: 0, dx: 0, dz: 0, ph: rnd() * 6 });
})();
function updateSteam(dt) {
  STEAM.acc += dt * 7;
  while (STEAM.acc > 1) { STEAM.acc -= 1; const s = STEAM.items.find(s => s.life < 0); if (s) Object.assign(s, { life: 0, x: rr(-0.05, 0.05), y: 0, z: rr(-0.05, 0.05), dx: rr(-0.03, 0.03), dz: rr(-0.02, 0.02), ph: rnd() * 6 }); }
  const P = STEAM.geo.attributes.position, A = STEAM.geo.attributes.aAlpha, S = STEAM.geo.attributes.aSize, a = STEAM.anchor;
  STEAM.items.forEach((s, i) => {
    if (s.life >= 0) {
      s.life += dt / 2.4; s.y += dt * 0.19; s.x += (s.dx + Math.sin(sim.time * 1.7 + s.ph) * 0.02) * dt; s.z += s.dz * dt;
      if (s.life >= 1) s.life = -1;
    }

    P.setXYZ(i, a.x + s.x, a.y + s.y, a.z + s.z); A.setX(i, on ? Math.sin(Math.PI * s.life) * 0.28 : 0); S.setX(i, on ? 0.18 + s.life * 0.5 : 0);
  });

}

  if (byClick) { toast("Treasure! (and bubbles)"); if (sim.paused) setPaused(false, true); }
}
function updateChest(dt) {
  const C = chest;
  if (C.state === "closed") { C.timer -= dt; if (C.timer < 0) openChest(); }
  else if (C.state === "opening") { C.t += dt / 0.9; if (C.t >= 1) { C.t = 1; C.state = "open"; C.timer = 1.6; } }
  else if (C.state === "open") { C.timer -= dt; if (C.timer < 0) C.state = "closing"; }
  else if (C.state === "closing") { C.t -= dt / 1.0; if (C.t <= 0) { C.t = 0; C.state = "closed"; C.timer = rr(12, 20); } }
  C.open = smooth(C.t);
  C.lid.rotation.x = -C.open * 1.1;
  C.innerMat.emissiveIntensity = 0.4 + C.open * 1.6;
}
lightHooks.push((t, m) => { L.chest.intensity = chest.open * 5.5 * m("chestMul"); });
function toggleDoor() { cabinetDoor.open = !cabinetDoor.open; toast(cabinetDoor.open ? "Towels, a bucket, spare media — and a note." : "Cabinet closed."); if (sim.paused) setPaused(false, true); }
function updateDoor(dt) { cabinetDoor.angle = damp(cabinetDoor.angle, cabinetDoor.open ? 1.15 : 0, 5, dt); cabinetDoor.group.rotation.y = -cabinetDoor.angle; }
function updateDuck(dt) {
  const D = duck; if (D.t > 1) return; D.t += dt; const k = Math.min(1, D.t);
  D.group.position.y = sandH(-3.05, -1.35) + 0.09 + Math.sin(Math.PI * k) * 0.1; D.group.rotation.y = 2.2 + Math.sin(Math.PI * k) * 1.2; D.group.rotation.z = Math.sin(Math.PI * 2 * k) * 0.25;
}
function updateHouseplant() { for (const l of plantLeaves) { const b = l.userData.base, ph = l.userData.ph; l.rotation.set(b[0] + Math.cos(sim.time * 0.5 + ph) * 0.02, b[1], b[2] + Math.sin(sim.time * 0.6 + ph) * 0.035); } }

/* =====================================================================
   14. Picking, click/drag discrimination, shared actions, UI
   ===================================================================== */
const raycaster = new THREE.Raycaster();
scene.traverse(o => { if (o.isPoints || o.isLine || o.isInstancedMesh || o === backdrop) o.raycast = () => {}; });
const pointer = { down: false, x0: 0, y0: 0, moved: false, lastClick: 0, pending: null, hoverT: 0 };
const $ = id => document.getElementById(id);
const toastEl = $("toast"), hoverEl = $("hover-hint"), statusEl = $("status");
let toastTimer = null;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2300); }
function setStatus(msg) { statusEl.textContent = msg; }
function ndcFromEvent(e, out) { const r = canvas.getBoundingClientRect(); return out.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); }
const _ndc = new THREE.Vector2();
function pick(ndc) {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  let glassHit = null, waterHit = null;
  for (const h of hits) {
    const o = h.object, owner = o.userData.owner || o, act = o.userData.action || owner.userData.action;
    if (act === "glass") { if (!glassHit) glassHit = h; continue; }
    if (act === "water") { if (!waterHit) waterHit = h; if (o === waterSurface) return { action: "surface", hit: h, glassHit, waterHit }; continue; }
    if (act) return { action: act, hit: h, owner, glassHit, waterHit };
    if (o.userData.blocker || owner.userData.blocker) return { action: "blocked", hit: h, glassHit, waterHit };
    const mat = Array.isArray(o.material) ? o.material[0] : o.material;
    if (mat && mat.transparent) continue;                               // bubbles, droplets, bottle glass
    if (waterHit) return { action: "decor", hit: h, glassHit, waterHit }; // underwater decoration
    return { action: "blocked", hit: h, glassHit, waterHit };
  }
  return { action: null, glassHit, waterHit };
}
function feedAt(x, z, source) { dropFood(x, z, source); }
function tapAt(hit) { if (!hit) return; const n = hit.object.userData.normal; glassTap(hit.point, n, 1, "user"); toast("Tap. The fish keep their distance."); }
function handleClick(ndc, isDouble) {
  const r = pick(ndc);
  switch (r.action) {
    case "surface": feedAt(r.hit.point.x, r.hit.point.z, "water"); return;
    case "chest": openChest(true); return;
    case "duck": if (duck.t > 1) { duck.t = 0; toast("Squeak."); if (sim.paused) setPaused(false, true); } return;
    case "door": toggleDoor(); return;
    case "notebook": if (notebook.t > 1.7) { notebook.t = 0; toast("Day 042 — Milo: suspicious."); if (sim.paused) setPaused(false, true); } return;
    case "jar": if (foodJar.t > 1) { if (FOOD.cooldown > 0) { toast("The fish are still busy with the last pinch…"); return; } foodJar.t = 0; foodJar.fed = false; if (sim.paused) setPaused(false, true); } return;
    case "lamp": setNight(!lighting.night); toast(lighting.night ? "Lamp clicked — night falls." : "Lamp clicked — morning again."); return;
    case "milo": if (!miloStartTap("click")) toast("Milo is busy being a cat."); return;
    case "fish": if (isDouble && r.waterHit) feedAt(r.waterHit.point.x, r.waterHit.point.z, "water"); else { toast(r.hit.object.userData.label); tapAt(r.glassHit); } return;
    default:
      if (isDouble && r.waterHit) { feedAt(r.waterHit.point.x, r.waterHit.point.z, "water"); return; }
      if (r.glassHit) tapAt(r.glassHit);
  }
}
const HOVERABLE = new Set(["surface", "chest", "duck", "door", "notebook", "jar", "lamp", "milo", "fish", "water", "glass"]);
function updateHover(e) {
  const r = pick(ndcFromEvent(e, _ndc));
  let label = null;
  if (HOVERABLE.has(r.action)) label = r.action === "surface" ? "Click to feed" : (r.hit.object.userData.label || (r.owner && r.owner.userData.label));
  else if (r.glassHit && r.action !== "milo") label = "Tap the glass · double-click to feed";
  canvas.style.cursor = label ? "pointer" : "grab";
  if (label) { hoverEl.textContent = label; hoverEl.style.left = (e.clientX + 14) + "px"; hoverEl.style.top = (e.clientY + 14) + "px"; hoverEl.classList.add("show"); }
  else hoverEl.classList.remove("show");
}
canvas.addEventListener("pointerdown", e => { pointer.down = true; pointer.moved = false; pointer.x0 = e.clientX; pointer.y0 = e.clientY; view.lastInteraction = ui.time; hoverEl.classList.remove("show"); });
canvas.addEventListener("pointermove", e => {
  if (pointer.down) { if (Math.hypot(e.clientX - pointer.x0, e.clientY - pointer.y0) > 6) pointer.moved = true; view.lastInteraction = ui.time; return; }
  if (e.pointerType === "mouse" && ui.time - pointer.hoverT > 0.07) { pointer.hoverT = ui.time; updateHover(e); }
});
canvas.addEventListener("pointerup", e => {
  if (!pointer.down) return; pointer.down = false; view.lastInteraction = ui.time;
  if (pointer.moved) return;
  const now = performance.now(); ndcFromEvent(e, _ndc); const ndc = _ndc.clone();
  if (now - pointer.lastClick < 300 && pointer.pending) { clearTimeout(pointer.pending); pointer.pending = null; pointer.lastClick = 0; handleClick(ndc, true); return; }
  pointer.lastClick = now;
  pointer.pending = setTimeout(() => { pointer.pending = null; handleClick(ndc, false); }, 240);
});
canvas.addEventListener("pointerleave", () => { hoverEl.classList.remove("show"); });
canvas.addEventListener("contextmenu", e => e.preventDefault());
controls.addEventListener("start", () => { view.lastInteraction = ui.time; if (!view.tween) view.userMoved = true; });
controls.addEventListener("change", () => { view.lastInteraction = ui.time; });

/* ---------- interface ---------- */
function setPaused(paused, silent = false) {
  sim.paused = paused; const b = $("btn-pause");
  b.innerHTML = (paused ? "Resume" : "Pause") + "<kbd>Space</kbd>"; b.setAttribute("aria-pressed", String(paused));
  setStatus(paused ? "Simulation paused" : "Simulation running"); if (!silent) toast(paused ? "Paused — camera still works." : "Resumed.");
}
function updateViewButton() { $("btn-view").innerHTML = (view.mode === "room" ? "Reef view" : "Room view") + "<kbd>C</kbd>"; }
function toggleUI(show) { document.body.classList.toggle("ui-hidden", !show); setStatus(show ? "Controls shown" : "Controls hidden — press H to show"); requestLayout(); }
$("btn-feed").addEventListener("click", () => dropFood(0.3, 0.5, "button"));
$("btn-night").addEventListener("click", () => setNight(!lighting.night));
$("btn-pause").addEventListener("click", () => setPaused(!sim.paused));
$("btn-view").addEventListener("click", () => flyTo(view.mode === "room" ? "reef" : "room"));
$("btn-reset").addEventListener("click", () => { view.userMoved = false; flyTo("room"); });
$("btn-hide").addEventListener("click", () => toggleUI(false));
$("show-ui").addEventListener("click", () => toggleUI(true));
window.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || ""; if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " " && (tag === "BUTTON" || tag === "A")) return;           // keep native activation on focused controls
  if (k === "f") dropFood(0.3, 0.5, "button"); else if (k === "n") setNight(!lighting.night); else if (k === " ") { e.preventDefault(); setPaused(!sim.paused); }
  else if (k === "c") flyTo(view.mode === "room" ? "reef" : "room"); else if (k === "r") { view.userMoved = false; flyTo("room"); }
  else if (k === "h") toggleUI(document.body.classList.contains("ui-hidden"));
});
setTimeout(() => $("hint").classList.add("faded"), 7500);

/* =====================================================================
   15/16. Layout, banner reservation, resize, main loop, context recovery
   ===================================================================== */
let layoutTimer = null;
function requestLayout() { clearTimeout(layoutTimer); layoutTimer = setTimeout(updateLayout, 60); }
function updateLayout() {
  const w = window.innerWidth, h = window.innerHeight;
  const banner = $("promo-banner").getBoundingClientRect();
  layout.top = banner.bottom + 8;
  const dock = $("dock"), uiHidden = document.body.classList.contains("ui-hidden");
  layout.bottom = uiHidden ? 24 : (h - dock.getBoundingClientRect().top) + 8;
  document.documentElement.style.setProperty("--toast-top", (banner.bottom + 10) + "px");
  document.documentElement.style.setProperty("--dock-h", (uiHidden ? 0 : dock.getBoundingClientRect().height) + "px");
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!view.userMoved) flyTo(view.mode, true); else controls.maxDistance = Math.max(60, computeView(view.mode).dist * 1.8);
}
const resizeObs = new ResizeObserver(requestLayout); resizeObs.observe($("promo-banner")); resizeObs.observe($("dock"));
window.addEventListener("resize", requestLayout);

const clock = new THREE.Clock();
let contextLost = false, rafId = 0, running = true;
canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); contextLost = true; setStatus("Graphics context lost — waiting to recover"); });
canvas.addEventListener("webglcontextrestored", () => { contextLost = false; clock.getDelta(); setStatus("Graphics context restored"); });
const _camOff = V3();
function frame() {
  if (!running) return;
  rafId = requestAnimationFrame(frame);
  if (contextLost) return;
  const raw = Math.min(clock.getDelta(), 0.1);
  ui.dt = raw; ui.time += raw;
  sim.dt = sim.paused ? 0 : raw; sim.time += sim.dt; U.time.value = sim.time;
  lighting.t = clamp(lighting.t + (lighting.night ? 1 : -1) * raw / 2.2, 0, 1); applyLighting();
  updateCameraTween(raw);
  if (!view.tween) {
    if (!reducedMotion && !sim.paused && !pointer.down && ui.time - view.lastInteraction > 6) {
      _camOff.subVectors(camera.position, controls.target).applyAxisAngle(V3_UP, Math.sin(ui.time * 0.11) * 0.016 * raw); camera.position.copy(controls.target).add(_camOff);
    }
    controls.update(); controls.target.clamp(PAN_BOX.min, PAN_BOX.max);
  }
  if (sim.dt > 0) simulate(sim.dt);
  renderer.render(scene, camera);
}
function simulate(dt) {
  updateSurface(dt);
  for (const f of fishes) f.update(dt, fishes, FOOD.items);
  updateFood(dt); updateBubbles(dt); updateSteam(dt); updateTaps(dt); updateSnail(dt); updateShrimp(dt); updateCrab(dt);
  updateChest(dt); updateMilo(dt); updateDoor(dt); updateJar(dt); updateNotebook(dt); updateDuck(dt); updateClock(); updateHouseplant();
}

/* ---------- 17. teardown ---------- */
function dispose() {
  running = false; cancelAnimationFrame(rafId); resizeObs.disconnect();
  scene.traverse(o => { if (o.geometry) o.geometry.dispose(); const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []); for (const m of mats) m.dispose(); });
  for (const t of disposables) t.dispose(); envTex.dispose(); controls.dispose(); renderer.dispose();
}
window.addEventListener("pagehide", dispose, { once: true });

/* environment-map contribution: tame by default, much dimmer at night */
const envMats = [];
scene.traverse(o => { const ms = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []); for (const m of ms) if (m.envMapIntensity !== undefined && !m.userData.envTracked) { m.userData.envTracked = true; m.userData.envBase = m.envMapIntensity === 1 ? 0.45 : m.envMapIntensity; envMats.push(m); } });
lightHooks.push((t) => { const k = lerp(1, 0.22, t); for (const m of envMats) m.envMapIntensity = m.userData.envBase * k; });

/* ---------- start ---------- */
setNight(false, true); applyLighting(); setPaused(false, true);
updateLayout(); flyTo("room", true); view.userMoved = false;
renderer.compile(scene, camera);
setStatus("Keeper's corner ready");
frame();
</script>
